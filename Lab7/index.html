<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPA Каталог товарів</title>
    <!-- Підключення Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Навігація -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html">TechStore</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <!-- Посилання на саму сторінку (оновлення) -->
                        <a class="nav-link" href="index.html">Додому</a>
                    </li>
                    <li class="nav-item">
                        <!-- Динамічне завантаження каталогу -->
                        <a class="nav-link" href="#" id="nav-catalog">Каталог</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Основний контент (сюди динамічно завантажуються сторінки) -->
    <main class="container my-5" id="main-content">
        <!-- Початковий вміст (Домашня сторінка) -->
        <div class="text-center py-5">
            <h1 class="display-4 fw-bold">Вітаємо у TechStore!</h1>
            <p class="lead text-muted">Найкращий вибір електроніки. Натисніть "Каталог" для перегляду товарів.</p>
            <button class="btn btn-primary btn-lg mt-3" id="btn-home-catalog">Перейти до каталогу</button>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
